name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        working-directory: bridge
        run: npm ci

      - name: Build bridge
        working-directory: bridge
        run: npm run build

      - name: Check dist in sync
        if: runner.os == 'Linux'
        shell: bash
        run: git diff --exit-code -- bridge/dist

      - name: Run tests
        working-directory: bridge
        run: npm run test:ci

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check extension syntax
        run: node tools/syntax-check.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        working-directory: bridge
        run: npm ci

      - name: Audit production dependencies
        working-directory: bridge
        run: npm audit --omit=dev --audit-level=high
