<html lang="en">
<head>
<meta charset="utf-8">
<title>MyChrome brand</title>
<!--
  Repository branding for MyChrome 1.0, rendered by build-brand.mjs with headless Chrome.
  ?kind=banner|social  &theme=dark|light
  The signature is the product's own moment: a tab lit by the soft multicolor agent glow, the
  agent's arrow mid-click, and the real side panel (a capture from tools/panel-preview).
-->
<style>
  @font-face { font-family: "DM Sans"; font-weight: 400; src: url("../../extension/fonts/DMSans-400.woff2") format("woff2"); }
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url("../../extension/fonts/DMSans-500.woff2") format("woff2"); }
  @font-face { font-family: "DM Sans"; font-weight: 600; src: url("../../extension/fonts/DMSans-600.woff2") format("woff2"); }

  :root {
    --g1: #8AB4F8; --g2: #F28B82; --g3: #FDD663; --g4: #81C995;
    --bg: #0E0C12; --bg-2: #15121B; --ink: #F5F2F8; --ink-2: #B9B2C4; --ink-3: #857E91;
    --win: #1A1720; --win-line: rgba(255,255,255,.08); --page: #121016; --page-ink: #EDE9F2; --page-ink-2: #9C95A8;
    --btn: #F5F2F8; --btn-ink: #121016; --rule: rgba(255,255,255,.07);
  }
  :root[data-theme="light"] {
    --bg: #FBF9F6; --bg-2: #F3EFE9; --ink: #17131D; --ink-2: #514A5B; --ink-3: #7B7484;
    --win: #FFFFFF; --win-line: rgba(23,19,29,.10); --page: #FFFFFF; --page-ink: #17131D; --page-ink-2: #6A6374;
    --btn: #17131D; --btn-ink: #FFFFFF; --rule: rgba(23,19,29,.08);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* The glow, exactly as the extension draws it: a thin rounded ring of the soft palette, blurred. */
  .glow { position: absolute; pointer-events: none; filter: blur(var(--blur, 14px)); opacity: var(--glow-o, .9); }
  .glow .ring {
    position: absolute; inset: 0; border-radius: var(--r, 18px); padding: var(--w, 10px); overflow: hidden;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .glow .ring::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 300%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(var(--turn, 35deg));
    background: conic-gradient(from 0deg, var(--g1), var(--g2), var(--g3), var(--g4), var(--g1));
  }

  .logo { display: block; border-radius: 22%; box-shadow: 0 10px 30px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18); }
  :root[data-theme="light"] .logo { box-shadow: 0 10px 28px rgba(40,24,60,.16), 0 2px 6px rgba(40,24,60,.10); }

  /* ---------- Banner 1600 x 480 ---------- */
  .banner { position: relative; width: 1600px; height: 480px; }
  .banner .copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 690px; display: flex; flex-direction: column; justify-content: center; }
  .lockup { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .lockup .logo { width: 76px; height: 76px; }
  .wordmark { font-size: 76px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .headline { font-size: 31px; font-weight: 500; line-height: 1.22; letter-spacing: -0.018em; max-width: 21ch; text-wrap: balance; }
  .sub { margin-top: 16px; font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 44ch; }
  .meta { margin-top: 28px; font-size: 14.5px; color: var(--ink-3); letter-spacing: .01em; }
  .meta b { color: var(--ink-2); font-weight: 600; }

  .scene { position: absolute; right: 64px; top: 46px; width: 760px; height: 388px; }
  .window {
    position: absolute; inset: 0; border-radius: 16px; overflow: hidden; background: var(--win);
    border: 1px solid var(--win-line);
    box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.25);
    display: grid; grid-template-rows: 38px 1fr;
  }
  :root[data-theme="light"] .window { box-shadow: 0 30px 70px rgba(40,24,60,.16), 0 6px 18px rgba(40,24,60,.10); }
  .chrome { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--win-line); }
  .omni { flex: 1; height: 22px; border-radius: 11px; background: var(--bg-2); display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; color: var(--ink-3); }
  .chrome .ext { width: 18px; height: 18px; border-radius: 5px; }
  .body { display: grid; grid-template-columns: 1fr 268px; min-height: 0; }

  .page { position: relative; background: var(--page); color: var(--page-ink); padding: 26px 30px; overflow: hidden; }
  .page h3 { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
  .page .lede { font-size: 12.5px; color: var(--page-ink-2); margin-bottom: 18px; }
  .items { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 16px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--rule); font-size: 13px; }
  .item .name { font-weight: 500; }
  .item .price { font-variant-numeric: tabular-nums; color: var(--page-ink-2); }
  .item .add { padding: 5px 11px; border-radius: 8px; background: var(--bg-2); font-size: 12px; font-weight: 600; }
  .item.pick .add { background: var(--btn); color: var(--btn-ink); }
  .page .glow { inset: 0; --r: 14px; --w: 9px; --blur: 11px; --glow-o: .95; }

  .cursor { position: absolute; width: 22px; height: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ripple { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--g1); transform: translate(-50%, -50%); opacity: .7; }
  .caption {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); white-space: nowrap;
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px;
    background: rgba(27,18,48,.86); color: #FFF9F0; font-size: 11.5px;
  }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; }
  .dots i:nth-child(1) { background: #4285F4; } .dots i:nth-child(2) { background: #EA4335; } .dots i:nth-child(3) { background: #FBBC05; } .dots i:nth-child(4) { background: #34A853; }

  .panel { border-left: 1px solid var(--win-line); overflow: hidden; background: var(--bg); }
  .panel img { width: 100%; display: block; }

  /* ---------- Social preview 1280 x 640 ---------- */
  .social { position: relative; width: 1280px; height: 640px; display: grid; place-items: center; text-align: center; }
  .social > .glow { inset: 4px; --r: 28px; --w: 26px; --blur: 30px; --glow-o: 1; }
  .social .stack { display: flex; flex-direction: column; align-items: center; }
  .social .logo { width: 128px; height: 128px; margin-bottom: 30px; }
  .social .wordmark { font-size: 92px; }
  .social .headline { margin-top: 22px; font-size: 32px; max-width: 26ch; }
  .social .meta { margin-top: 34px; font-size: 17px; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get("theme") === "light" ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  const kind = q.get("kind") || "banner";
  const panelShot = `../../docs/screens/banner-panel-${theme}.png`;
  const arrow = `<svg class="cursor" viewBox="0 0 24 28" style="left:VAR_X;top:VAR_Y"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285F4"/><stop offset="1" stop-color="#1A73E8"/></linearGradient></defs><path d="M4 3 L4 23 L9.4 17.9 L13 25.6 L16.6 24 L13.1 16.4 L20.6 16.4 Z" fill="url(#a)" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  const meta = `Unofficial extension for Google Antigravity · <b>v1.0</b> · by Ahmed Maky`;
  if (kind === "social") {
    document.body.innerHTML = `
      <main class="social">
        <div class="glow"><div class="ring"></div></div>
        <div class="stack">
          <img class="logo" src="../brand-assets/icon256.png" alt="">
          <div class="wordmark">MyChrome</div>
          <p class="headline">Your Antigravity agent, at work in the Chrome you're signed in to.</p>
          <p class="meta">${meta}</p>
        </div>
      </main>`;
  } else {
    document.body.innerHTML = `
      <main class="banner">
        <section class="copy">
          <div class="lockup"><img class="logo" src="../brand-assets/icon256.png" alt=""><span class="wordmark">MyChrome</span></div>
          <p class="headline">Your Antigravity agent, at work in the Chrome you're signed in to.</p>
          <p class="sub">Ask in the side panel. It reads, clicks and types in your tab while you watch every step, and it asks before anything you can't undo.</p>
          <p class="meta">${meta}</p>
        </section>
        <section class="scene">
          <div class="window">
            <div class="chrome"><div class="omni">trailgear.example/shoes</div><img class="ext" src="../../extension/icons/icon32.png" alt=""></div>
            <div class="body">
              <div class="page">
                <div class="glow"><div class="ring"></div></div>
                <h3>Trail running shoes</h3>
                <p class="lede">48 results · sorted by rating</p>
                <div class="items">
                  <div class="item"><span class="name">Ridgeline 4 GTX</span><span class="price">$149</span><span class="add">Compare</span></div>
                  <div class="item pick"><span class="name">Summit Glide Pro</span><span class="price">$132</span><span class="add">Compare</span></div>
                  <div class="item"><span class="name">Canyon Grip 2</span><span class="price">$118</span><span class="add">Compare</span></div>
                  <div class="item"><span class="name">Northwind Trail</span><span class="price">$124</span><span class="add">Compare</span></div>
                </div>
                <span class="ripple" style="left:408px;top:177px"></span>
                ${arrow.replace("VAR_X", "404px").replace("VAR_Y", "174px")}
                <div class="caption"><span class="dots"><i></i><i></i><i></i><i></i></span>Comparing the two best-rated pairs</div>
              </div>
              <aside class="panel"><img src="${panelShot}" alt=""></aside>
            </div>
          </div>
        </section>
      </main>`;
  }
</script>
</body>
</html>
