<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay preview</title>
<link rel="icon" href="/extension/icons/icon32.png">
<style>
  :root { color-scheme: light dark; --bg: #fbfaf8; --text: #1b1230; --muted: #6b6478; --line: #e6e1ea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141217; --text: #f4f0f8; --muted: #a59fb0; --line: #2c2832; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 160px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 24px 0; }
  button, input { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); }
  input { flex: 1; min-width: 180px; }
</style>
</head>
<body>
<main>
  <h1>Overlay preview</h1>
  <p>Loads the extension's content.js with a stubbed chrome.runtime. Drive it from the console with
  <code>__send({ type: "SET_OVERLAY_STATE", state: "acting", message: "Clicking Search" })</code>,
  <code>__send({ type: "SHOW_CLICK_CUE", x, y })</code>, or the <code>?demo</code> query.</p>
  <div class="row">
    <input id="q" placeholder="Search products">
    <button id="go" type="button">Search</button>
  </div>
  <div class="row">
    <button type="button">Filters</button>
    <button type="button">Sort by price</button>
  </div>
</main>
<script>
  // Not shipped: a design harness for the in-page overlay.
  const listeners = [];
  window.chrome = { runtime: { id: "preview", onMessage: { addListener: (f) => listeners.push(f) }, sendMessage: () => Promise.resolve() } };
  window.__send = (msg) => new Promise((ok) => listeners.forEach((f) => f(msg, {}, ok)));
  window.__favicon = () => [...document.querySelectorAll('link[rel~="icon"]')].map((l) => l.href.slice(0, 40));
</script>
<script src="/extension/content.js"></script>
<script>
  if (new URLSearchParams(location.search).has("demo")) {
    const at = (el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2) }; };
    (async () => {
      await __send({ type: "SET_OVERLAY_STATE", state: "acting", message: "Typing the search", lang: "en" });
      await __send({ type: "SHOW_CLICK_CUE", ...at(document.getElementById("q")) });
      await new Promise((r) => setTimeout(r, 900));
      await __send({ type: "SHOW_CLICK_CUE", ...at(document.getElementById("go")) });
    })();
  }
</script>
</body>
</html>
