<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyChrome panel preview</title>
<script>
// Design preview of the real side panel outside Chrome. chrome.* is stubbed and the background
// port replays a scenario: ?s=idle | working | done | offline | approval. Not shipped with the extension.
(() => {
  const evt = () => {
    const fns = [];
    return { addListener: (f) => fns.push(f), removeListener: (f) => { const i = fns.indexOf(f); if (i >= 0) fns.splice(i, 1); }, hasListener: () => false, _fire: (...a) => fns.forEach((f) => f(...a)) };
  };
  const store = {};
  const area = {
    get(keys, cb) {
      const out = {};
      const list = keys == null ? Object.keys(store) : Array.isArray(keys) ? keys : typeof keys === "string" ? [keys] : Object.keys(keys);
      for (const k of list) {
        if (k in store) out[k] = store[k];
        else if (keys && typeof keys === "object" && !Array.isArray(keys)) out[k] = keys[k];
      }
      if (cb) cb(out);
      return Promise.resolve(out);
    },
    set(o, cb) { Object.assign(store, o); if (cb) cb(); return Promise.resolve(); },
    remove(k, cb) { [].concat(k).forEach((x) => delete store[x]); if (cb) cb(); return Promise.resolve(); },
  };
  const tab = { id: 1, windowId: 1, active: true, url: "https://en.wikipedia.org/wiki/Artificial_intelligence", title: "Artificial intelligence - Wikipedia", favIconUrl: "" };
  const portMsg = evt();
  const port = {
    name: "antigravity-sidepanel",
    onMessage: portMsg,
    onDisconnect: evt(),
    postMessage(m) {
      (window.__posted = window.__posted || []).push(m);
      if (m.type === "hello") setTimeout(() => window.__scenario && window.__scenario(port), 0);
    },
    disconnect() {},
    _send: (m) => portMsg._fire(m),
  };
  window.__port = port;
  window.chrome = {
    runtime: {
      id: "preview",
      connect: () => port,
      getURL: (p) => `/extension/${p}`,
      getManifest: () => ({ version: "5.3.0" }),
      sendMessage: () => Promise.resolve({}),
      onMessage: evt(),
      lastError: undefined,
    },
    storage: { local: area, session: area, sync: area, onChanged: evt() },
    tabs: {
      query: async () => [tab],
      get: async () => tab,
      update: async () => tab,
      create: async () => tab,
      captureVisibleTab: async () => "",
      onUpdated: evt(),
      onActivated: evt(),
    },
    sidePanel: { setOptions: async () => {}, open: async () => {} },
  };
})();
</script>
<script src="/tools/panel-preview/scenarios.js"></script>
</head>
<body>
<script type="module">
  const base = "/extension/";
  const html = await (await fetch(base + "sidepanel.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  for (const a of doc.documentElement.attributes) document.documentElement.setAttribute(a.name, a.value);
  const b = document.createElement("base");
  b.href = base;
  document.head.prepend(b);
  const load = (src) => new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
  for (const el of doc.head.children) {
    if (el.tagName === "LINK") document.head.appendChild(el.cloneNode(true));
    else if (el.tagName === "META" || el.tagName === "TITLE") continue;
    else if (el.tagName === "SCRIPT" && el.src) await load(el.getAttribute("src"));
    else if (el.tagName === "STYLE") document.head.appendChild(el.cloneNode(true));
  }
  const modules = [...doc.body.querySelectorAll("script")].map((s) => s.getAttribute("src"));
  doc.body.querySelectorAll("script").forEach((s) => s.remove());
  for (const a of doc.body.attributes) document.body.setAttribute(a.name, a.value);
  document.body.innerHTML = doc.body.innerHTML;
  for (const m of modules) await import(base + m);
</script>
</body>
</html>
